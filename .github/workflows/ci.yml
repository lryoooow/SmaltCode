name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --maxWorkers=1 --no-file-parallelism

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run package
      - run: npm run package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: SmaltCode-windows
          path: |
            dist-pkg/smalt.exe
            dist-pkg/*.tgz
            packages/desktop/release/SmaltCode-Setup-*.exe
